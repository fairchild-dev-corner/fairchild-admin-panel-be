<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{.Subject}}</title>
</head>
<body style="margin:0; padding:0; background-color:#f2f4f7; font-family:Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f2f4f7; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; background-color:#ffffff; border-radius:8px; overflow:hidden; border:1px solid #e4e7eb;">
          <tr>
            <td style="background-color:#0f4c81; padding:24px 32px;">
              <span style="font-size:18px; font-weight:bold; color:#ffffff;">{{.BrandName}}</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <h1 style="margin:0 0 20px; font-size:20px; line-height:1.3; color:#111827;">{{.Subject}}</h1>
              <p style="margin:0; font-size:15px; line-height:1.6; color:#1f2937; white-space:pre-line;">{{.Body}}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px; background-color:#f9fafb; border-top:1px solid #e4e7eb;">
              <span style="font-size:12px; color:#6b7280;">You're receiving this because you're a {{.BrandName}} member with a member portal account. Questions? Email fairchildcoop@fccmpc.org.</span>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
